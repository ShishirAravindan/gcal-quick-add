<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Add</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/public/site.webmanifest">
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
    <meta name="theme-color" content="#002b36">
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <div class="status-puck">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">System Ready</span>
            </div>
            <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
                <span class="material-symbols-rounded">light_mode</span>
            </button>
        </div>

        <header>
            <div class="app-title">
                <span id="appLogo" class="material-symbols-rounded app-logo">calendar_add_on</span>
                <h1>Quick Add</h1>
            </div>
        </header>

        <main>
            <!-- Magic Box (Input Area) -->
            <div id="magicBoxContainer" class="magic-box-container">
                <div class="magic-box">
                    <textarea 
                        id="eventInput" 
                        placeholder="What's happening?"
                        autocomplete="off"
                    ></textarea>
                </div>
            </div>

            <!-- Engine Pill -->
            <div id="enginePill" class="engine-pill">
                <span class="material-symbols-rounded" style="font-size: 14px;">settings_input_component</span>
                <span id="currentModelLabel">Loading...</span>
            </div>

            <!-- Serving Dock -->
            <div class="serving-dock">
                <div class="dock-item selected" data-pattern="CLOUD">
                    <span class="material-symbols-rounded">cloud</span>
                    <span>Cloud</span>
                </div>
                <div class="dock-item" data-pattern="BROWSER">
                    <span class="material-symbols-rounded">laptop</span>
                    <span>Browser</span>
                </div>
                <div class="dock-item" data-pattern="DEVICE">
                    <span class="material-symbols-rounded">devices</span>
                    <span>Device</span>
                </div>
            </div>

            <!-- Action Area (Progressive Button) -->
            <div class="action-area">
                <div id="actionFlipCard" class="flip-card">
                    <div class="flip-front">
                        <button id="mainActionButton" class="primary-button">
                            <span class="material-symbols-rounded">auto_awesome</span>
                            <span id="buttonText">Create Event</span>
                        </button>
                    </div>
                    <div class="flip-back">
                        <div id="keyGroup" class="config-group" style="width: 100%;">
                            <div class="config-label">Secret Key</div>
                            <div class="config-row">
                                <input type="password" id="apiKeyInput" class="api-input" placeholder="Enter API Key">
                            </div>
                        </div>
                        <div id="urlGroup" class="config-group" style="width: 100%;">
                            <div class="config-label">Base URL</div>
                            <div class="config-row">
                                <input type="text" id="baseUrlInput" class="api-input" placeholder="http://localhost:11434">
                            </div>
                        </div>
                        <div class="config-row" style="margin-top: 4px;">
                            <button id="saveConfig" class="primary-button" style="flex: 1;">
                                <span class="material-symbols-rounded">check</span> Save Configuration
                            </button>
                            <button id="cancelConfig" class="theme-btn">
                                 <span class="material-symbols-rounded">close</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Idea Drawer -->
            <div id="ideaDrawer" class="idea-drawer">
                <div class="chip" data-example="Dinner with Monica tonight at 8pm">Dinner tonight</div>
                <div class="chip" data-example="Workout every MWF at 7am for 1h">Gym Routine</div>
                <div class="chip" data-example="Flight to London on June 12 at 10:30am">Flight Info</div>
            </div>

            <div id="statusMessage" class="status-message" style="text-align: center; margin-top: 16px;"></div>
        </main>
    </div>

    <!-- Selection Tray Overlay -->
    <div id="trayOverlay" class="tray-overlay"></div>
    <div id="modelTray" class="model-tray">
        <div class="tray-header">
            <h3>Select Model</h3>
            <button id="closeTray" class="theme-btn">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
        <div id="trayList" class="tray-list">
            <!-- Dynamic items -->
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
