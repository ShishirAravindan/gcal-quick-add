<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Calendar Event</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/public/site.webmanifest">
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="app-title">
                <span class="material-symbols-rounded app-logo">calendar_add_on</span>
                <h1>Quick Add</h1>
            </div>
            
            <div class="header-controls">
                <div class="model-status">
                    <div id="statusIndicator" class="status-indicator disconnected"></div>
                    <span id="modelIcon" class="material-symbols-rounded" style="font-size: 18px; display: none;">cloud</span>
                    <span id="modelName">Connecting...</span>
                    <button id="retryConnection" class="retry-button" style="display: none;">Retry</button>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="material-symbols-rounded">light_mode</span>
                </button>
            </div>
        </header>

        <main>
            <!-- Main UI: Input Section -->
            <section class="card">
                <div class="input-container">
                    <textarea 
                        id="eventInput" 
                        placeholder="e.g., 'Team lunch tomorrow at 12pm at Italian Place'"
                    ></textarea>
                    <div class="button-container">
                        <div id="statusMessage" class="status-message"></div>
                        <button id="createEvent" class="create-button">
                            <span class="material-symbols-rounded">add</span>
                            Create Event
                        </button>
                    </div>
                </div>

                <!-- Model Selection (Below Main Input) -->
                <div class="model-selector">
                    <label for="modelSelect">Model Serving Pattern</label>
                    <select id="modelSelect"></select>
                    
                    <div id="apiKeyContainer" style="display: none; margin-top: 12px;">
                        <div class="api-key-input">
                            <input type="password" id="apiKeyInput" placeholder="Enter API Key" />
                            <button id="saveApiKey" class="api-key-button">Save</button>
                        </div>
                        <p class="api-key-info">Stored locally in your browser.</p>
                    </div>
                </div>
            </section>

            <!-- Examples Accordion -->
            <section class="examples-section">
                <div class="examples-header" id="examplesHeader">
                    <h2><span class="material-symbols-rounded">lightbulb</span> Examples</h2>
                    <button id="examplesToggle" class="examples-toggle">
                        <span class="material-symbols-rounded">expand_less</span>
                    </button>
                </div>
                <ul id="exampleList" class="example-list">
                    <li data-example="Coffee chat with Sarah next Tuesday at 10am">
                        <div class="example-title">Coffee chat</div>
                        <div class="example-text">with Sarah next Tuesday at 10am</div>
                    </li>
                    <li data-example="Weekly team sync every Monday at 2pm until Dec 20">
                        <div class="example-title">Weekly sync</div>
                        <div class="example-text">every Monday at 2pm until Dec 20</div>
                    </li>
                    <li data-example="Flight to NYC on Jan 15th at 8am">
                        <div class="example-title">Travel</div>
                        <div class="example-text">Flight to NYC on Jan 15th at 8am</div>
                    </li>
                </ul>
            </section>
        </main>

        <footer>
            <p>Powered by LangChain & Gemini/Ollama</p>
        </footer>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
