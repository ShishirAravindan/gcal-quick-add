<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Add</title>
    <meta name="description" content="Open Google Calendar with event details from a short note.">
    <meta name="theme-color" content="#f4f3eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18201b" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/public/site.webmanifest">
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
</head>
<body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-gemini" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2c0 5.5 4.5 10 10 10-5.5 0-10 4.5-10 10 0-5.5-4.5-10-10-10 5.5 0 10-4.5 10-10Z"/></symbol>
        <symbol id="icon-openrouter" viewBox="0 0 24 24"><path d="M3 12h7m0 0 6-6h5m-4-4 4 4-4 4m-7 2 6 6h5m-4-4 4 4-4 4"/></symbol>
        <symbol id="icon-browser" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-14-2h.01m3 0h.01"/></symbol>
        <symbol id="icon-ollama" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 8 4 4-4 4m6 0h4"/></symbol>
        <symbol id="icon-lmstudio" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="2.5" fill="var(--panel)"/><circle cx="16" cy="17" r="2.5" fill="var(--panel)"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="16" r="4"/><path d="m11 13 9-9m-4 4 3 3"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-4L3 9m0-5v5h5m-4 5a8 8 0 0 0 14 4l3-3m-5 0h5v5"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    </svg>
    <main class="workspace">
        <header class="app-header">
            <h1>Quick Add</h1>
            <button type="button" id="settingsButton" class="secondary icon-button" aria-label="Settings" aria-haspopup="dialog" aria-controls="modelTray">
                <svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg>
            </button>
        </header>

        <section class="command-panel" aria-label="Event composer">
            <form id="eventForm">
                <label class="field-label" for="eventInput">Describe an event</label>
                <textarea id="eventInput" rows="2" autocomplete="off" enterkeyhint="enter"
                    placeholder="Lunch with Priya on Friday at 12:30 for an hour at Beco"></textarea>
                <p id="eventError" class="error" role="alert" hidden></p>
                <div class="command-footer">
                    <button id="mainActionButton" class="primary" type="submit">
                        <span id="calendarActionLabel">Open in Calendar</span>
                        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-right"/></svg>
                    </button>
                </div>
            </form>

            <p id="calendarStatus" class="sr-only" role="status"></p>
        </section>
    </main>

    <dialog id="modelTray" aria-labelledby="modelHeading">
        <div class="dialog-heading">
            <h2 id="modelHeading">Settings</h2>
            <button id="closeTray" type="button" class="secondary icon-button" aria-label="Close settings">
                <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
            </button>
        </div>
        <section class="settings-section" aria-labelledby="modelSectionHeading">
            <h3 id="modelSectionHeading">Model</h3>
            <div id="activeProvider" class="active-model">
                <svg class="icon provider-icon" aria-hidden="true"><use id="currentModelIcon" href="#icon-gemini"/></svg>
                <span id="currentModelLabel">Google AI Studio</span>
            </div>
            <div id="providerChoices"></div>
            <p id="providerStatus" class="help" role="status"></p>
            <section id="googlePicker" class="dialog-field" aria-labelledby="geminiHeading" hidden>
                <div class="model-picker-heading">
                    <h4 id="geminiHeading">Gemini model</h4>
                    <button type="button" id="refreshGoogleModels" class="secondary icon-button" aria-label="Refresh Gemini models" title="Refresh Gemini models">
                        <svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
                    </button>
                </div>
                <details id="googleModelChoices" class="model-choices" hidden>
                    <summary id="googleModelSummary">
                        <span id="googleModelName">Choose a model</span>
                        <svg class="icon" aria-hidden="true"><use href="#icon-chevron"/></svg>
                    </summary>
                    <ul id="googleModelList" aria-label="Available Gemini models"></ul>
                </details>
                <p id="googleCatalogStatus" class="help" role="status"></p>
            </section>
        </section>
        <section id="modelConfig" class="settings-section" aria-labelledby="connectionHeading" hidden>
            <h3 id="connectionHeading">Connection</h3>
            <form id="keyForm" class="dialog-field" hidden>
                <label id="apiKeyLabel" for="apiKeyInput">API key</label>
                <div class="inline-controls">
                    <input type="password" id="apiKeyInput" autocomplete="off" spellcheck="false">
                    <button id="saveConfig" type="submit" class="secondary">Save key</button>
                </div>
            </form>
            <button id="editKey" type="button" class="key-button" hidden>
                <svg class="icon" aria-hidden="true"><use href="#icon-key"/></svg> Change API key
            </button>
        </section>
    </dialog>

    <script type="module" src="./script.js"></script>
</body>
</html>
